{{/* Custom CSS and JS additions for the blog */}}

<!-- Google Fonts for Chinese + English typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Prism.js for syntax highlighting -->
<link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

<style>
  /* ========== CSS Variables ========== */
  :root {
    --color-bg: #fafafa;
    --color-bg-card: #ffffff;
    --color-text: #1a1a2e;
    --color-text-secondary: #4a4a6a;
    --color-text-muted: #8888a8;
    --color-primary: #3b82f6;
    --color-primary-light: #eff6ff;
    --color-border: #e8e8f0;
    --color-accent: #6366f1;
    --color-code-bg: #1e1e2e;
    --color-blockquote-border: #6366f1;
    --color-toc-active: #3b82f6;
    --color-toc-hover: #eff6ff;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 30px rgba(0,0,0,0.1);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-serif: 'Noto Serif SC', Georgia, serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    --sidebar-width: 260px;
    --nav-height: 60px;
    --content-max-width: 780px;
  }

  /* ========== Base Reset ========== */
  body {
    font-family: var(--font-sans) !important;
    background-color: var(--color-bg);
    color: var(--color-text);
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ========== Top Navigation ========== */
  .top-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--nav-height);
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--color-border);
    z-index: 1000;
    display: flex;
    align-items: center;
    padding: 0 2rem;
  }

  .top-nav-inner {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .top-nav-logo {
    font-family: var(--font-serif);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--color-text);
    text-decoration: none;
    letter-spacing: -0.02em;
  }

  .top-nav-logo:hover {
    color: var(--color-primary);
  }

  .top-nav-links {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .top-nav-links a {
    color: var(--color-text-secondary);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    transition: color 0.2s;
  }

  .top-nav-links a:hover {
    color: var(--color-primary);
  }

  /* Hamburger button */
  .hamburger-btn {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
    color: var(--color-text);
  }

  .hamburger-btn svg {
    width: 24px;
    height: 24px;
  }

  /* ========== Layout with Sidebar ========== */
  .page-wrapper {
    display: flex;
    min-height: 100vh;
    padding-top: var(--nav-height);
  }

  /* Sidebar TOC */
  .sidebar {
    position: fixed;
    top: var(--nav-height);
    left: 0;
    width: var(--sidebar-width);
    height: calc(100vh - var(--nav-height));
    overflow-y: auto;
    background: var(--color-bg-card);
    border-right: 1px solid var(--color-border);
    padding: 1.5rem 1rem;
    z-index: 100;
    transition: transform 0.3s ease;
  }

  .sidebar-title {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--color-text-muted);
    margin-bottom: 1rem;
    padding-left: 0.5rem;
  }

  .toc-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .toc-list li {
    margin: 0;
  }

  .toc-list a {
    display: block;
    padding: 0.4rem 0.5rem;
    color: var(--color-text-secondary);
    text-decoration: none;
    font-size: 0.85rem;
    line-height: 1.4;
    border-radius: var(--radius-sm);
    border-left: 2px solid transparent;
    transition: all 0.2s;
  }

  .toc-list a:hover {
    background: var(--color-toc-hover);
    color: var(--color-primary);
  }

  .toc-list a.active {
    background: var(--color-toc-hover);
    color: var(--color-toc-active);
    border-left-color: var(--color-toc-active);
    font-weight: 500;
  }

  .toc-list .toc-h3 a {
    padding-left: 1.5rem;
    font-size: 0.8rem;
  }

  /* Main content area */
  .main-content {
    flex: 1;
    margin-left: var(--sidebar-width);
    padding: 2rem 3rem;
    max-width: var(--content-max-width);
  }

  /* ========== Typography ========== */
  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-serif);
    color: var(--color-text);
    line-height: 1.3;
    margin-top: 2.5em;
    margin-bottom: 0.8em;
  }

  h1 { font-size: 2rem; font-weight: 700; margin-top: 0; }
  h2 { font-size: 1.5rem; font-weight: 600; border-bottom: 1px solid var(--color-border); padding-bottom: 0.3em; }
  h3 { font-size: 1.2rem; font-weight: 600; }
  h4 { font-size: 1.05rem; font-weight: 600; }

  p {
    margin-bottom: 1.2em;
    color: var(--color-text);
  }

  a {
    color: var(--color-primary);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  /* ========== Code Blocks ========== */
  pre {
    background: var(--color-code-bg) !important;
    border-radius: var(--radius-md) !important;
    padding: 1.2rem 1.5rem !important;
    overflow-x: auto;
    margin: 1.5em 0 !important;
    box-shadow: var(--shadow-md);
    border: 1px solid rgba(255,255,255,0.06);
  }

  pre code {
    font-family: var(--font-mono) !important;
    font-size: 0.85rem !important;
    line-height: 1.7 !important;
    background: none !important;
    padding: 0 !important;
    color: #cdd6f4 !important;
    text-shadow: none !important;
  }

  code {
    font-family: var(--font-mono) !important;
    font-size: 0.88em;
    background: #f1f5f9;
    color: #e11d48;
    padding: 0.15em 0.4em;
    border-radius: 4px;
  }

  pre code {
    background: none;
    color: inherit;
    padding: 0;
  }

  /* ========== Blockquotes ========== */
  blockquote {
    margin: 1.5em 0;
    padding: 1em 1.5em;
    border-left: 4px solid var(--color-blockquote-border);
    background: linear-gradient(135deg, #f8f7ff 0%, #f0f0ff 100%);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    color: var(--color-text-secondary);
    font-style: italic;
  }

  blockquote p:last-child {
    margin-bottom: 0;
  }

  /* ========== Callout / Alert Boxes ========== */
  .callout {
    margin: 1.5em 0;
    padding: 1rem 1.25rem;
    border-radius: var(--radius-md);
    border-left: 4px solid;
    font-size: 0.9rem;
  }

  .callout-info {
    background: #eff6ff;
    border-color: #3b82f6;
    color: #1e40af;
  }

  .callout-warning {
    background: #fffbeb;
    border-color: #f59e0b;
    color: #92400e;
  }

  .callout-danger {
    background: #fef2f2;
    border-color: #ef4444;
    color: #991b1b;
  }

  .callout-success {
    background: #f0fdf4;
    border-color: #22c55e;
    color: #166534;
  }

  /* ========== Tables ========== */
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.5em 0;
    font-size: 0.9rem;
    border-radius: var(--radius-sm);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }

  thead {
    background: #f8fafc;
  }

  th {
    padding: 0.75rem 1rem;
    text-align: left;
    font-weight: 600;
    border-bottom: 2px solid var(--color-border);
  }

  td {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--color-border);
  }

  tbody tr:hover {
    background: #f8fafc;
  }

  /* ========== Images ========== */
  img {
    max-width: 100%;
    height: auto;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
  }

  /* ========== Horizontal Rule ========== */
  hr {
    border: none;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--color-border), transparent);
    margin: 2.5em 0;
  }

  /* ========== Post Content - Eye-friendly Background ========== */
  .post-content p {
    padding: 0.6em 0.8em;
    margin-bottom: 0.8em;
    border-radius: var(--radius-sm);
    background: #f0f5f0;
    transition: background 0.2s;
  }

  .post-content p:nth-of-type(even) {
    background: #f5f2ec;
  }

  .post-content p:hover {
    background: #e8f0e8;
  }

  .post-content p:nth-of-type(even):hover {
    background: #f0ebe0;
  }

  /* ========== Post List / Archive ========== */
  .post-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .post-list-item {
    padding: 1.5rem 1rem;
    border-bottom: 1px solid var(--color-border);
    transition: background 0.2s;
    border-radius: var(--radius-sm);
    background: #f0f5f0;
  }

  .post-list-item:nth-child(even) {
    background: #f5f2ec;
  }

  .post-list-item:hover {
    background: #e8f0e8;
  }

  .post-list-item:nth-child(even):hover {
    background: #f0ebe0;
  }

  .post-list-item h2,
  .post-list-item h3 {
    margin: 0 0 0.3em 0;
    border: none;
    padding: 0;
  }

  .post-list-item h2 a,
  .post-list-item h3 a {
    color: var(--color-text);
    text-decoration: none;
  }

  .post-list-item h2 a:hover,
  .post-list-item h3 a:hover {
    color: var(--color-primary);
  }

  .post-meta {
    font-size: 0.8rem;
    color: var(--color-text-muted);
    margin-bottom: 0.5rem;
  }

  .post-summary {
    font-size: 0.9rem;
    color: var(--color-text-secondary);
    line-height: 1.6;
  }

  /* ========== Pagination ========== */
  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
    margin: 3rem 0 1rem;
    padding: 0;
    list-style: none;
  }

  .pagination a,
  .pagination span {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    height: 36px;
    padding: 0 0.75rem;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.2s;
  }

  .pagination a {
    color: var(--color-text-secondary);
    background: var(--color-bg-card);
    border: 1px solid var(--color-border);
  }

  .pagination a:hover {
    background: var(--color-primary);
    color: white;
    border-color: var(--color-primary);
  }

  .pagination .active span {
    background: var(--color-primary);
    color: white;
    border: 1px solid var(--color-primary);
  }

  /* ========== Footer ========== */
  .site-footer {
    margin-left: var(--sidebar-width);
    padding: 2rem 3rem;
    text-align: center;
    color: var(--color-text-muted);
    font-size: 0.8rem;
    border-top: 1px solid var(--color-border);
  }

  /* ========== Mobile Overlay ========== */
  .sidebar-overlay {
    display: none;
    position: fixed;
    top: var(--nav-height);
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 99;
  }

  /* ========== Mobile Responsive ========== */
  @media (max-width: 960px) {
    .sidebar {
      transform: translateX(-100%);
      box-shadow: var(--shadow-lg);
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-overlay.open {
      display: block;
    }

    .main-content {
      margin-left: 0;
      padding: 1.5rem 1.25rem;
    }

    .site-footer {
      margin-left: 0;
      padding: 1.5rem 1.25rem;
    }

    .hamburger-btn {
      display: block;
    }

    .top-nav-links {
      display: none;
    }

    h1 { font-size: 1.6rem; }
    h2 { font-size: 1.3rem; }
    h3 { font-size: 1.1rem; }
  }

  /* ========== Scrollbar ========== */
  .sidebar::-webkit-scrollbar {
    width: 4px;
  }

  .sidebar::-webkit-scrollbar-track {
    background: transparent;
  }

  .sidebar::-webkit-scrollbar-thumb {
    background: var(--color-border);
    border-radius: 2px;
  }

  /* ========== Selection ========== */
  ::selection {
    background: #bfdbfe;
    color: #1e3a5f;
  }

  /* ========== Tags ========== */
  .tag {
    display: inline-block;
    padding: 0.2em 0.6em;
    margin: 0.2em 0.3em 0.2em 0;
    font-size: 0.75rem;
    background: #f1f5f9;
    color: var(--color-text-secondary);
    border-radius: 999px;
    text-decoration: none;
    transition: all 0.2s;
  }

  .tag:hover {
    background: var(--color-primary);
    color: white;
    text-decoration: none;
  }

  /* ========== Reading Progress Bar ========== */
  .reading-progress {
    position: fixed;
    top: var(--nav-height);
    left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--color-primary), var(--color-accent));
    z-index: 1001;
    transition: width 0.1s;
    border-radius: 0 2px 2px 0;
  }

  /* ========== Home Page ========== */
  .home-hero {
    margin-top: var(--nav-height);
    background:
      linear-gradient(135deg, rgba(26, 26, 46, 0.96) 0%, rgba(49, 46, 129, 0.92) 48%, rgba(30, 64, 175, 0.9) 100%);
    padding: 4rem 2rem 4.5rem;
  }

  .home-hero-inner {
    max-width: 980px;
    margin: 0 auto;
  }

  .home-kicker {
    margin: 0 0 0.75rem;
    color: rgba(255,255,255,0.68);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .home-hero h1 {
    margin: 0 0 0.8rem;
    color: #fff;
    font-family: var(--font-serif);
    font-size: clamp(2.2rem, 6vw, 4.6rem);
    line-height: 1;
  }

  .home-hero p:last-child {
    max-width: 620px;
    margin: 0;
    color: rgba(255,255,255,0.82);
    font-size: 1.05rem;
  }

  .home-container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 3rem 2rem 4rem;
  }

  .home-article-layout {
    display: grid;
    grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
    gap: 2rem;
    align-items: start;
  }

  .archive-index {
    order: 1;
  }

  .latest-posts {
    order: 2;
    min-width: 0;
  }

  .archive-sticky {
    position: sticky;
    top: calc(var(--nav-height) + 1.5rem);
    max-height: calc(100vh - var(--nav-height) - 3rem);
    overflow-y: auto;
    background: var(--color-bg-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 1.25rem;
  }

  .archive-label,
  .section-heading p {
    margin: 0 0 0.35rem;
    color: var(--color-text-muted);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .archive-index h2,
  .section-heading h2 {
    margin: 0;
    border: 0;
    padding: 0;
    font-size: 1.35rem;
  }

  .section-heading {
    margin-bottom: 1rem;
  }

  .archive-month {
    margin-top: 1.25rem;
  }

  .archive-month h3 {
    margin: 0 0 0.6rem;
    color: var(--color-text-secondary);
    font-family: var(--font-sans);
    font-size: 0.88rem;
    font-weight: 700;
  }

  .archive-month ol {
    display: grid;
    gap: 0.55rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .archive-month li {
    display: grid;
    grid-template-columns: 3.2rem minmax(0, 1fr);
    gap: 0.65rem;
    align-items: baseline;
  }

  .archive-month time {
    color: var(--color-text-muted);
    font-family: var(--font-mono);
    font-size: 0.72rem;
  }

  .archive-month a {
    color: var(--color-text-secondary);
    font-size: 0.86rem;
    line-height: 1.45;
    text-decoration: none;
  }

  .archive-month a:hover {
    color: var(--color-primary);
    text-decoration: none;
  }

  .latest-posts .post-list {
    display: grid;
    gap: 1rem;
  }

  .latest-posts .post-list-item {
    padding: 1.4rem 1.5rem;
    border: 1px solid var(--color-border);
    box-shadow: var(--shadow-sm);
  }

  .latest-posts .post-list-item h3 {
    font-size: 1.2rem;
  }

  .latest-posts .post-summary {
    margin-bottom: 0;
  }

  @media (max-width: 960px) {
    .home-hero {
      padding: 3rem 1.25rem 3.25rem;
    }

    .home-container {
      padding: 2rem 1.25rem 3rem;
    }

    .home-article-layout {
      grid-template-columns: 1fr;
    }

    .latest-posts {
      order: 1;
    }

    .archive-index {
      order: 2;
    }

    .archive-sticky {
      position: static;
      max-height: none;
      overflow: visible;
    }
  }
</style>
