<div class="mermaid">
{{ .Inner | htmlEscape | safeHTML }}
</div>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({
    startOnLoad: true,
    theme: 'neutral',
    securityLevel: 'strict',
    flowchart: { curve: 'basis' }
  });
</script>
