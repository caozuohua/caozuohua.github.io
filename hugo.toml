baseURL = 'https://caozuohua.github.io/'
locale = 'zh-cn'
title = 'CAO ZUOHUA'
theme = 'ananke'

# 放行 Markdown 中的原始 HTML。
# 本站部分文章（如 fund-portfolio-analyzer）用内联 <style> + <div> 卡片排版，
# goldmark 默认 unsafe=false 会静默丢弃这些 HTML——不报错，只发一条 "Raw HTML omitted"
# 告警，而线上内容直接消失。设为 true 才能正常渲染。
[markup.goldmark.renderer]
  unsafe = true

[pagination]
  pagerSize = 10

[params]
  description = '记录 AI Agent、自动化与系统工程中的具体问题、失败和判断'
  author = 'Cao Zuohua'
  show_reading_time = true

[[menu.main]]
  name = 'Blog'
  url = '/'
  weight = 10

[[menu.main]]
  name = 'Posts'
  url = '/posts/'
  weight = 20

[[menu.main]]
  name = 'Portal'
  url = 'https://caozuohua.github.io/portal/'
  weight = 30

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[params.ananke]
  show_recent_posts = true
